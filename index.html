<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Get Rick Rolled | Инфо-портал</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gemoroy.exe. Сборник полезной инфы и зарикроленных шедевров.">
    
    <style>
        /* Сброс стилей и общая тема */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .wrapper {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* Заголовок-поздравление */
        h1 {
            font-size: 22px;
            color: #1a1a1a;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eaeaea;
        }

        /* Секция с картинками */
        .images-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .images-container img {
            width: 31%;
            min-width: 150px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .images-container img:hover {
            transform: scale(1.02);
        }

        /* Блок контента из Википедии (интегрированный хаос) */
        .wiki-section {
            background: #f8f9fa;
            border-left: 4px solid #3b82f6;
            padding: 20px;
            margin: 25px 0;
            border-radius: 0 8px 8px 0;
        }

        .wiki-section h2 {
            font-size: 18px;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .wiki-section p {
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 10px;
        }

        /* iframe блок */
        .iframe-container {
            margin-top: 30px;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }

        /* Адаптивность для мобильных */
        @media (max-width: 768px) {
            .images-container img {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Ваше личное поздравление / заголовок -->
        <h1>Matviy, сам ти мапедік і ще ти зарікролен! Щасливого тобі 11 вересня!!!</h1> 

        <!-- Галерея картинок -->
        <div class="images-container">
            <img src="85703242-b679-4f89-8e52-475e573c5d04.jpg" alt="Will Ferrell">
            <img src="753ac30d-ed2d-4e78-bdad-9f22aa752c65.jpg" alt="Rick Astley">
            <img src="extreme-macro-one-dollar-bill-pyramid-eye.jpg" alt="Conspiracy">
        </div>

        <!-- Интегрированная Вики-секция (тот самый «хаос», оформленный как информационный блок) -->
        <div class="wiki-section">

            <img src=""
        </div>

        <!-- Подключенный сайт / iframe -->
        <div class="iframe-container">
            <iframe src="site.html" title="Внутренний сайт"></iframe>
        </div>
    </div>

</body>
</html>
