    <style>

            margin: 0;
            padding: 0;

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;

        .wrapper {
            max-width: 850px;
            margin: 0 auto;

            color: #1a1a1a;

        .images-container {
            display: flex;
            justify-content: space-between;

            min-width: 130px;
            height: 160px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .wiki-section {
            background: #f8f9fa;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 6px 6px 0;
        }

        .wiki-section h2 {
            font-size: 16px;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .wiki-section p {
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 10px;
        }

        .wiki-section img {
            display: block;
            max-width: 100%;
            max-height: 300px;
            width: auto;
            height: auto;
            margin: 10px auto;
            border-radius: 6px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
            object-fit: contain;
        }

        @media (max-width: 768px) {
            .images-container img {
                width: 100%;
                height: 180px;
            }
        }
    </style>
</head>
